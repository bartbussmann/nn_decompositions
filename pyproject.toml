[project]
name = "nn-decompositions"
version = "0.1.0"
description = "Per-layer (PLT) and cross-layer (CLT) transcoders for the VPD paper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0",
    "transformer-lens>=1.8",
    "wandb>=0.16",
    "datasets>=2.14",
    "tqdm",
    "matplotlib",
    "numpy",
    "einops",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["nn_decompositions"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
